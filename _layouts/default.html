<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <script src="{{ '/assets/js/theme.js' | relative_url }}"></script>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    {% if page.math %}
      <link rel="stylesheet" href="{{ '/assets/vendor/katex/katex.min.css' | relative_url }}">
      <script defer src="{{ '/assets/vendor/katex/katex.min.js' | relative_url }}"></script>
      <script defer src="{{ '/assets/vendor/katex/auto-render.min.js' | relative_url }}"></script>
    {% endif %}
    <script defer src="{{ '/assets/js/site.js' | relative_url }}"></script>
  </head>
  <body>
    <a class="skip-link" href="#content">跳到正文</a>
    <header class="site-header">
      <div class="header-inner container">
        <a class="site-title" href="{{ '/' | relative_url }}" aria-label="{{ site.title | escape }}，首页">g64<span class="brand-dot">.</span></a>
        <nav class="site-nav" aria-label="主导航">
          <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>首页</a>
          <a href="{{ '/articles/' | relative_url }}" {% if page.url contains '/articles/' or page.layout == 'post' %}aria-current="page"{% endif %}>文章</a>
          <a href="{{ '/series/' | relative_url }}" {% if page.url contains '/series/' %}aria-current="page"{% endif %}>系列</a>
        </nav>
        <label class="theme-control" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor" stroke="none"/></svg>
          <span class="sr-only">外观</span>
          <select id="theme-select" aria-label="外观"><option value="system">系统</option><option value="light">浅色</option><option value="dark">深色</option></select>
        </label>
      </div>
    </header>
    <main id="content" class="container" tabindex="-1">{{ content }}</main>
    <footer class="site-footer container"><span>{{ site.title | escape }}</span><span>保持好奇，慢慢积累。</span></footer>
  </body>
</html>
